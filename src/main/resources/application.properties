# =============================================================================
# Aplicación
# =============================================================================
quarkus.application.name=cobros-demo

# =============================================================================
# Datasource: SQLite
# =============================================================================
# Quarkus no trae extensión oficial de SQLite, por eso se declara el driver y el
# dialecto explícitamente con db-kind=other.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# WAL mejora la concurrencia lectura/escritura; busy_timeout evita SQLITE_BUSY.
quarkus.datasource.jdbc.url=jdbc:sqlite:./data/cobros.db?journal_mode=WAL&busy_timeout=5000
# SQLite es single-writer: una única conexión evita bloqueos.
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1

# =============================================================================
# Hibernate ORM
# =============================================================================
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# =============================================================================
# Seguridad (token estático en header X-API-Token)
# =============================================================================
app.security.api-token=change-me
app.security.system-user=sistema

# =============================================================================
# OpenAPI / Swagger UI
# =============================================================================
quarkus.smallrye-openapi.info-title=Cobros API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# =============================================================================
# Perfil de test: SQLite en memoria
# =============================================================================
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
